<title>Hara Daniel — @frezonegamer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #2b2b2b 0%, #0a0a0a 70%);
    color: #fff;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin: 0 auto 16px;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
    object-fit: cover;
    display: block;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
  }
  p.sub {
    color: #b7aecb;
    font-size: 14px;
    margin-top: 4px;
    margin-bottom: 28px;
  }
  .links {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    padding-top: 8px;
  }
  a.link {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    border-radius: 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  a.link:hover {
    background: rgba(255,255,255,0.12);
    transform: translateY(-3px);
  }
  a.link .icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }
  a.link .label {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translate(-50%, 4px);
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    color: #d9d2e8;
    background: rgba(20,14,32,0.9);
    padding: 3px 8px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  a.link:hover .label {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #665c7a;
  }
</style>
